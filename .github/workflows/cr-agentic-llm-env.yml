# Configure the LLM model tiers in the Contabo server's CR_AGENTIC/.env and
# read discovery-worker agent logs, without shell access to the VPS.
#
#   configure: if the GEMINI_API_KEY Actions secret is set, writes it into
#              OPENAI_API_KEY (the value is never printed) and points
#              OPENAI_BASE_URL, OPENAI_MODEL, and OPENAI_NAV_MODEL at Gemini.
#              If that secret is absent, detects OpenRouter (sk-or-) or OpenAI
#              from the key already in .env, backs up .env, sets the matching
#              models, then recreates the workers.
#   logs:      prints recent course-discovery lines from discovery-worker.
#
# Never prints OPENAI_API_KEY, GEMINI_API_KEY, or any other secret.

name: CR_AGENTIC LLM env

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "configure or logs"
        required: true
        default: logs
        type: choice
        options: [logs, configure]
      since:
        description: "Log window for logs mode (e.g. 2h, 30m)"
        required: false
        default: 2h

concurrency:
  group: cr-agentic-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run on Contabo via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          MODE: ${{ inputs.mode }}
          SINCE: ${{ inputs.since }}
          # Empty when the secret is unset. The remote script must not echo it.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          envs: MODE,SINCE,GEMINI_API_KEY
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/courserep/courserep_backend/CR_AGENTIC
            ENV_FILE=.env
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            COMPOSE="$DC --env-file ../.env -f docker-compose.prod.yml"

            if [ "$MODE" = "configure" ]; then
              backed_up=0
              backup_env() {
                if [ "$backed_up" -eq 0 ]; then
                  cp "$ENV_FILE" "$ENV_FILE.bak-$(date +%Y%m%d%H%M%S)"
                  backed_up=1
                fi
              }
              # Replace or append NAME=VALUE without echoing the value.
              # The value is passed to awk via the environment so it is not a
              # sed replacement (which treats \ & | specially) and is not an argv.
              set_var() {
                local tmp
                tmp="$(mktemp)"
                SET_VAR_NAME="$1" SET_VAR_VALUE="$2" awk '
                  BEGIN {
                    name = ENVIRON["SET_VAR_NAME"]
                    value = ENVIRON["SET_VAR_VALUE"]
                    found = 0
                  }
                  index($0, name "=") == 1 {
                    print name "=" value
                    found = 1
                    next
                  }
                  { print }
                  END {
                    if (found == 0) print name "=" value
                  }
                ' "$ENV_FILE" > "$tmp"
                cat "$tmp" > "$ENV_FILE"
                rm -f "$tmp"
              }

              # Gemini is selected only when the Actions secret is present.
              # The key itself is not inspected (prefixes vary). An absent or
              # whitespace-only secret keeps the key already in .env and uses
              # OpenRouter (sk-or-) or OpenAI. Trim ends so a copied trailing
              # newline is not written into .env. The value is never printed.
              gemini_key="${GEMINI_API_KEY:-}"
              gemini_key="${gemini_key#"${gemini_key%%[![:space:]]*}"}"
              gemini_key="${gemini_key%"${gemini_key##*[![:space:]]}"}"
              if [ -n "$gemini_key" ]; then
                backup_env
                set_var OPENAI_API_KEY "$gemini_key"
                unset gemini_key GEMINI_API_KEY
                provider=gemini
                echo "Wrote GEMINI_API_KEY into OPENAI_API_KEY."
              else
                unset gemini_key
                echo "GEMINI_API_KEY is not set; keeping OPENAI_API_KEY from .env."
                key="$(grep -E '^OPENAI_API_KEY=' "$ENV_FILE" | tail -1 | cut -d= -f2- | tr -d "\"' " || true)"
                if [ -z "$key" ]; then
                  echo "OPENAI_API_KEY is missing from $ENV_FILE; refusing to change models."
                  exit 1
                fi
                case "$key" in
                  sk-or-*) provider=openrouter ;;
                  *) provider=openai ;;
                esac
                unset key
              fi
              echo "Key provider: $provider"
              echo "Before:"
              grep -E '^OPENAI_(MODEL|NAV_MODEL|BASE_URL)=' "$ENV_FILE" || echo "  (none set)"

              backup_env
              if [ "$provider" = "openrouter" ]; then
                set_var OPENAI_BASE_URL https://openrouter.ai/api/v1
                set_var OPENAI_MODEL openai/gpt-4o-mini
                set_var OPENAI_NAV_MODEL openai/gpt-4o
              elif [ "$provider" = "gemini" ]; then
                set_var OPENAI_BASE_URL https://generativelanguage.googleapis.com/v1beta/openai/
                set_var OPENAI_MODEL gemini-3.8-flash
                set_var OPENAI_NAV_MODEL gemini-3.8-flash
              else
                set_var OPENAI_MODEL gpt-4o-mini
                set_var OPENAI_NAV_MODEL gpt-4o
              fi
              echo "After:"
              grep -E '^OPENAI_(MODEL|NAV_MODEL|BASE_URL)=' "$ENV_FILE"

              cd docker
              $COMPOSE up -d --force-recreate --no-deps discovery-worker ai-worker
              sleep 10
              $COMPOSE ps discovery-worker ai-worker
              echo "==> discovery-worker startup"
              $COMPOSE logs --tail=60 discovery-worker 2>&1 | grep -iE 'Discovery worker started|error|invalid' | tail -10 || true
            else
              cd docker
              echo "==> discovery-worker course discovery (since ${SINCE:-2h})"
              $COMPOSE logs --since "${SINCE:-2h}" discovery-worker 2>&1 \
                | grep -E 'Discovery worker started|Deep scrape courses home|Courses from LMS adapter|not trustworthy|Portal agent step|Portal agent finished|Learned path|Scraped courses|Scraped assignments|Scraped timetable|LLM extraction failed|Portal agent crashed|Deep scrape phase failed|Deep scrape complete|Portal agent decision failed' \
                | tail -200 || echo "(no matching lines)"
            fi
