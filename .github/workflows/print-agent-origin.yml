# Prints the CR_AGENTIC EC2 public IP and local health so Cloudflare
# can be pointed at a reachable origin instead of Tailscale 100.x DNS.
name: Print agent origin

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  origin:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-0ec63ce951829039d
      ROLE_ARN: arn:aws:iam::887731515131:role/cr-agentic-gha-deploy
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Describe instance + probe origin
        run: |
          set -euo pipefail
          echo '=== EC2 describe ==='
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].{Id:InstanceId,State:State.Name,PublicIp:PublicIpAddress,PrivateIp:PrivateIpAddress,PublicDns:PublicDnsName}' \
            --output json || true

          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Print agent origin reachability" \
            --parameters '{"commands":["set -x; echo PUBLIC_IP=$(curl -4 -s --max-time 5 ifconfig.me || curl -4 -s --max-time 5 icanhazip.com); echo; hostname -I; echo; echo === health 3100 ===; curl -sS -m 5 -D - http://127.0.0.1:3100/health || true; echo; echo === listeners ===; ss -lntp | sed -n 1,40p || netstat -lntp | sed -n 1,40p; echo; echo === docker ===; docker ps || true"]}' \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CID"
          for i in $(seq 1 20); do
            sleep 5
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo '----- stdout -----'
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo '----- stderr -----'
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
