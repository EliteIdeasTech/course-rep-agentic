# CR_AGENTIC continuous deploy via SSM on EC2.
#
# Secrets (optional but recommended — match api.courserep.ng):
#   CR_AGENT_JWT_SECRET
#   CR_AGENT_JWT_ISSUER
#   CR_AGENT_JWT_AUDIENCE
#   CR_AGENT_CORS_ORIGIN

name: Deploy CR_AGENTIC

on:
  push:
    branches: [cr-agentic]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: cr-agentic-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-0ec63ce951829039d
      ROLE_ARN: arn:aws:iam::887731515131:role/cr-agentic-gha-deploy
      REPO_SLUG: buchion/courserep_backend
      DEPLOY_BRANCH: cr-agentic
      CR_AGENT_JWT_SECRET: ${{ secrets.CR_AGENT_JWT_SECRET }}
      CR_AGENT_JWT_ISSUER: ${{ secrets.CR_AGENT_JWT_ISSUER }}
      CR_AGENT_JWT_AUDIENCE: ${{ secrets.CR_AGENT_JWT_AUDIENCE }}
      CR_AGENT_CORS_ORIGIN: ${{ secrets.CR_AGENT_CORS_ORIGIN }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Print public origin IP
        run: |
          set -euo pipefail
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].{State:State.Name,PublicIp:PublicIpAddress,PrivateIp:PrivateIpAddress}' \
            --output json || true
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Print agent origin IP" \
            --parameters '{"commands":["echo PUBLIC_IP=$(curl -4 -s --max-time 5 ifconfig.me || true); hostname -I; curl -sS -m 5 -D - http://127.0.0.1:3100/health || true; ss -lntp | sed -n 1,30p; docker ps || true"]}' \
            --timeout-seconds 60 \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CID"
          for i in $(seq 1 12); do
            sleep 5
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo '----- origin stdout -----'
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true

      - name: Trigger remote deploy via SSM
        run: |
          set -euo pipefail

          DEFAULT_CORS='https://app.courserep.ng,https://app.courserep.org,https://course-rep-agent-web.pages.dev,https://agent.courserep.org,http://localhost:5173'
          export CORS_ORIGIN_EFFECTIVE="${CR_AGENT_CORS_ORIGIN:-$DEFAULT_CORS}"

          python3 <<'PY'
          import base64, json, os, textwrap
          from pathlib import Path

          updates = {}
          for key, env_key in [
              ("JWT_SECRET", "CR_AGENT_JWT_SECRET"),
              ("JWT_ISSUER", "CR_AGENT_JWT_ISSUER"),
              ("JWT_AUDIENCE", "CR_AGENT_JWT_AUDIENCE"),
              ("CORS_ORIGIN", "CORS_ORIGIN_EFFECTIVE"),
          ]:
              val = os.environ.get(env_key, "").strip()
              if val:
                  updates[key] = val

          updates_json = json.dumps(updates)
          repo = os.environ["REPO_SLUG"]
          branch = os.environ["DEPLOY_BRANCH"]

          inner = textwrap.dedent(
              f"""\
              set -euo pipefail
              cd "$HOME/courserep_backend"
              git remote set-url origin git@github.com:{repo}.git
              git fetch origin {branch}
              git checkout {branch}
              git pull --ff-only origin {branch}
              python3 <<'PY2'
              from pathlib import Path
              import json
              p = Path.home() / "courserep_backend/CR_AGENTIC/.env"
              text = p.read_text() if p.exists() else ""
              updates = json.loads({updates_json!r})
              lines = text.splitlines()
              seen = set()
              out = []
              for line in lines:
                  if not line or line.lstrip().startswith("#") or "=" not in line:
                      out.append(line)
                      continue
                  k = line.split("=", 1)[0].strip()
                  if k in updates:
                      out.append(f"{{k}}={{updates[k]}}")
                      seen.add(k)
                  else:
                      out.append(line)
              for k, v in updates.items():
                  if k not in seen:
                      out.append(f"{{k}}={{v}}")
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text("\\n".join(out) + "\\n")
              print("Updated keys:", ", ".join(sorted(updates)) or "(none)")
              PY2
              cd CR_AGENTIC/docker
              ./deploy.sh
              """
          )
          remote_b64 = base64.b64encode(inner.encode()).decode()
          # SSM runs as root; mirror prior deploy and execute as ubuntu.
          params = {
              "commands": [
                  f"runuser -l ubuntu -c 'echo {remote_b64} | base64 -d | bash'"
              ],
              "executionTimeout": ["7200"],
          }
          Path("params.json").write_text(json.dumps(params))
          print("Wrote params.json; env keys to sync:", ", ".join(sorted(updates)) or "(none)")
          PY

          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GHA deploy ${GITHUB_SHA:0:7}" \
            --parameters file://params.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CID"

          while true; do
            sleep 20
            ST=$(aws ssm get-command-invocation \
                   --command-id "$CID" --instance-id "$INSTANCE_ID" \
                   --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Remote deploy $ST"
                echo "----- stderr -----"
                aws ssm get-command-invocation --command-id "$CID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text || true
                exit 1 ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
