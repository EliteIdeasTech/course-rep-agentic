# CR_AGENTIC production deploy to Contabo VPS via SSH.
# This is the GitHub-executable copy (repo-root .github/workflows).
# Keep in sync with CR_AGENTIC/.github/workflows/deploy.yml.
#
# Required GitHub secrets:
#   CONTABO_HOST     — VPS address (84.46.240.202)
#   CONTABO_USER     — SSH user
#   CONTABO_SSH_KEY  — private key for that user
#
# Remote layout:
#   /opt/courserep/courserep_backend   (repo, branch cr-agentic)
#   CR_AGENTIC/docker/deploy.sh        (compose build + up)

name: CR_AGENTIC Deploy

on:
  push:
    branches: [cr-agentic]
    paths:
      - "CR_AGENTIC/**"
  workflow_dispatch:

concurrency:
  group: cr-agentic-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Contabo via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /opt/courserep/courserep_backend
            git fetch origin cr-agentic && git reset --hard origin/cr-agentic
            cd CR_AGENTIC/docker && bash ./deploy.sh

            echo "==> Waiting for agent health..."
            health_ok=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:3100/api/v1/agent/health >/dev/null 2>&1 \
                || curl -fsS --max-time 5 http://127.0.0.1:3100/health >/dev/null 2>&1; then
                echo "Health check passed (attempt ${i})"
                health_ok=1
                break
              fi
              echo "Health check attempt ${i}/30 failed; retrying in 5s..."
              sleep 5
            done

            if [ "$health_ok" != "1" ]; then
              echo "Health check failed after retries"
              if docker compose version >/dev/null 2>&1; then
                DC="docker compose"
              else
                DC="docker-compose"
              fi
              $DC --env-file ../.env -f docker-compose.prod.yml logs --tail=200 || true
              exit 1
            fi
